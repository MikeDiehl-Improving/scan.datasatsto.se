<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register reserved badge</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="registration">
    <main class="msgbox">
        <h1>Register reserved badge</h1>
        <p>Scan the badge QR code or enter the human-readable identity ID.</p>
        <button id="start-camera" type="button">Scan with webcam</button>
        <video id="camera" autoplay muted playsinline hidden></video>
        <p id="camera-message" role="status"></p>
        <form id="registration-form">
            <label>Encryption key (if used when generating badges) <input name="encryptionKey" type="password"></label>
            <label>Identity ID <input id="identity-id" name="id" inputmode="numeric" required></label>
            <button type="button" id="check-id">Check badge</button>
            <p id="badge-status" role="status"></p>
            <fieldset id="details" hidden>
                <label>Email <input name="email" type="email" required></label>
                <label>First name <input name="firstName" required></label>
                <label>Last name <input name="lastName" required></label>
                <label>Company/description <input name="description"></label>
                <label>Title/job title <input name="title"></label>
                <label>Phone <input name="phone"></label>
                <label>Location/Address <input name="location"></label>
                <label>Role (Volunteer/Organizer/Speaker) <input name="role"></label>
                <button type="submit">Register badge</button>
            </fieldset>
        </form>
    </main>
    <script src="/assets/jsQR.js"></script>
    <script src="/assets/registration.js"></script>
</body>
</html>
